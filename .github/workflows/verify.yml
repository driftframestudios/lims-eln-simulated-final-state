name: verify-simulated-final-state

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run executable forecast tests
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic forecast bundle
        env:
          PYTHONPATH: src
        run: python -m lims_eln_sim.cli --fixture fixtures/golden-specimen.json --output build/simulation
      - name: Check generated artifact boundary
        run: python tools/check_artifacts.py build/simulation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulated-final-state-${{ matrix.python-version }}
          path: build/simulation/
          if-no-files-found: error
          retention-days: 7
