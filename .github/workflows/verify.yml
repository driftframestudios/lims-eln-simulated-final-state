name: verify-simulated-final-state

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Confirm a human has allocated this remote proof
        required: true
        default: false
        type: boolean
      retain_forecast:
        description: Retain the forecast bundle for one day
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run executable forecast tests
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic forecast bundle
        env:
          PYTHONPATH: src
        run: >-
          python -m lims_eln_sim.cli
          --fixture fixtures/golden-specimen.json
          --intended-use-profile specification/intended-use-and-applicability-profile.json
          --migration-corpus fixtures/representative-migration-corpus.json
          --output build/simulation
      - name: Check generated artifact boundary
        run: python tools/check_artifacts.py build/simulation
      - name: Retain forecast bundle for one day
        if: ${{ always() && inputs.retain_forecast }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulated-final-state-${{ matrix.python-version }}
          path: build/simulation/
          if-no-files-found: error
          retention-days: 1

  simulation-validation:
    if: ${{ always() && vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete simulation proof matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate reproducibility, manifest integrity, and repository safety
        run: python tools/validate_repository.py
