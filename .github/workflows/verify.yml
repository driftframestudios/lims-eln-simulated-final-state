name: verify-vendor-evaluation

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run vendor-evaluation tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic vendor evaluation
        env:
          PYTHONPATH: src
        run: >-
          python -m lims_eln_sim.cli
          --fixture fixtures/golden-specimen.json
          --intended-use-profile specification/intended-use-and-applicability-profile.json
          --migration-corpus fixtures/representative-migration-corpus.json
          --database-reference database/vendor-evaluation-database-reference-v1.json
          --output build/evaluation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-evaluation-${{ matrix.python-version }}
          path: build/evaluation/result.json
          if-no-files-found: error
          retention-days: 7
