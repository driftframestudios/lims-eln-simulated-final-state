[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-simulated-final-state"
version = "0.3.1"
description = "Executable counterfactual for comparative LIMS/ELN collaboration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
contract-conformance = [
  "lims-eln-program-specification==0.3.1",
]

[project.scripts]
lims-eln-simulate = "lims_eln_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lims_eln_sim = ["contract_resources/*.json"]
