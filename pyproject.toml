[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-simulated-final-state"
version = "0.3.1"
description = "Executable counterfactual for comparative LIMS/ELN collaboration"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Driftframe Studios, Limited Liability Company"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
administrative-study = [
  "lims-eln-program-specification @ git+https://github.com/driftframestudios/lims-eln-program-specification.git@83a97deb76b9a5636cc7da484d350d5556c51661",
]
contract-conformance = [
  "lims-eln-program-specification @ git+https://github.com/driftframestudios/lims-eln-program-specification.git@4d06eeb7f96910311fbcb7f51547c978b6a07290",
]

[project.scripts]
lims-eln-simulate = "lims_eln_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lims_eln_sim = ["contract_resources/*.json", "administrative_resources/*.json"]
