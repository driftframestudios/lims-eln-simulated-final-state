[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-simulated-final-state"
version = "0.3.2"
description = "Executable counterfactual for comparative LIMS/ELN collaboration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lims-eln-simulate = "lims_eln_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
